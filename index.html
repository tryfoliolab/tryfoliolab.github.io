<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TryFolio Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root { color-scheme: light; --hanji: #f3ead8; --paper: #fffbf2; --ink: #2a2420; --inju: #b23a2a; --line: #5b4a3a; --dim: #6f6556; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--hanji); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; line-height: 1.75; }
main { max-width: 720px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-left, 0px)) 64px max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: 'Nanum Myeongjo', 'AppleMyungjo', serif; font-weight: 800; line-height: 1.35; text-wrap: balance; }
h1 { font-size: clamp(26px, 6vw, 34px); margin: 0 0 16px; }
h2 { font-size: 19px; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid #dccfb6; }
p, li { font-size: 15.5px; }
ul { padding-left: 1.3em; }
a { color: var(--inju); }
.meta { color: var(--dim); font-size: 14px; }
.app { background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-top: 24px; }
.app h2 { border: 0; margin: 0 0 4px; padding: 0; }
</style>
</head>
<body>
<main>
<h1>TryFolio Lab</h1>
<p>혼자 만드는 작은 게임을 소개합니다.</p>
<section class="app">
<h2>장원급제: 가로세로 낱말퍼즐</h2>
<p>조선 서당에 떨어진 현대인이 과거에 급제하는 이야기를 따라가는 낱말퍼즐. 답은 음절 조각으로 채웁니다.</p>
<p><a href="privacy/">개인정보 처리방침</a> · <a href="delete-data/">데이터 삭제 요청</a></p>
</section>
<p class="meta">문의 · <a href="mailto:tryfoliolab@gmail.com">tryfoliolab@gmail.com</a></p>
</main>
</body>
</html>
